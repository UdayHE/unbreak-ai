[project]
name = "unbreak-ai"
version = "0.1.0"
description = "Incident triage agent that investigates firing alerts and delivers a root-cause report."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unbreak_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=unbreak_ai --cov-report=term-missing --cov-fail-under=80"
markers = [
    "req(id): the requirement or NFR id (e.g. REQ-PRV-01) this test covers",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["unbreak_ai", "tests"]

[tool.importlinter]
root_package = "unbreak_ai"

[[tool.importlinter.contracts]]
name = "Dependencies point one way: agent > tools > providers"
type = "layers"
layers = [
    "unbreak_ai.agent",
    "unbreak_ai.tools",
    "unbreak_ai.providers",
]

[[tool.importlinter.contracts]]
name = "providers never import upstream modules"
type = "forbidden"
source_modules = ["unbreak_ai.providers"]
forbidden_modules = [
    "unbreak_ai.agent",
    "unbreak_ai.tools",
    "unbreak_ai.incidents",
    "unbreak_ai.intake",
    "unbreak_ai.notifiers",
]

[[tool.importlinter.contracts]]
name = "models is the lowest layer"
type = "forbidden"
source_modules = ["unbreak_ai.models"]
forbidden_modules = [
    "unbreak_ai.agent",
    "unbreak_ai.config",
    "unbreak_ai.incidents",
    "unbreak_ai.intake",
    "unbreak_ai.notifiers",
    "unbreak_ai.observability",
    "unbreak_ai.providers",
    "unbreak_ai.tools",
]

[[tool.importlinter.contracts]]
name = "config imports no feature module"
type = "forbidden"
source_modules = ["unbreak_ai.config"]
forbidden_modules = [
    "unbreak_ai.agent",
    "unbreak_ai.incidents",
    "unbreak_ai.intake",
    "unbreak_ai.notifiers",
    "unbreak_ai.providers",
    "unbreak_ai.startup",
    "unbreak_ai.tools",
]

[[tool.importlinter.contracts]]
name = "nothing imports startup"
type = "forbidden"
source_modules = [
    "unbreak_ai.agent",
    "unbreak_ai.config",
    "unbreak_ai.incidents",
    "unbreak_ai.intake",
    "unbreak_ai.models",
    "unbreak_ai.notifiers",
    "unbreak_ai.observability",
    "unbreak_ai.providers",
    "unbreak_ai.tools",
]
forbidden_modules = ["unbreak_ai.startup"]
